[package]
name = "cue"
version = "0.1.0"
description = "macOS 原生的多工作區 AI CLI 指揮中心"
authors = ["bryan"]
license = "MIT"
edition = "2021"

[lib]
# lib crate 名稱加上 `_lib` 後綴，避免與執行檔 `cue` 同名衝突；examples/ 探針以 cue_lib 引用
name = "cue_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
