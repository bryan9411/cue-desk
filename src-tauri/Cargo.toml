[package]
name = "cue"
version = "0.1.8"
description = "macOS 原生的多工作區 AI CLI 指揮中心"
authors = ["bryan"]
license = "MIT"
edition = "2021"

[lib]
# lib crate 名稱加上 `_lib` 後綴，避免與執行檔 `cue` 同名衝突；examples/ 探針以 cue_lib 引用
name = "cue_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
tauri-plugin-dialog = "2"
# MIT OR Apache-2.0；以 proc_pidinfo 取前景程式 cwd
libc = "0.2"
# 以下三者版本與 Tauri 已依賴的相同；MIT／MIT／Zlib OR Apache-2.0 OR MIT
# 偵測終端機安裝與執行狀態（NSWorkspace、NSRunningApplication）
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSArray"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSRunningApplication"] }

[dev-dependencies]
# MIT OR Apache-2.0；歸屬測試建立暫存目錄
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
